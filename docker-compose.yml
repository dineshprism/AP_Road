services:
  db:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: road_accident_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    # Internal-only: do not publish 3310 to the host / public Internet.
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  app:
    build:
      context: .
    restart: always
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      PGDATABASE: road_accident_db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      PORT: 3000
      NODE_ENV: production
      TRUST_PROXY: ${TRUST_PROXY:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:8080,http://localhost:8081}
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_THINKING_BUDGET: ${GEMINI_THINKING_BUDGET:-0}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-1200}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      GLOBAL_RATE_LIMIT_MAX: ${GLOBAL_RATE_LIMIT_MAX:-1000000}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-1000000}
      RAG_RATE_LIMIT_MAX: ${RAG_RATE_LIMIT_MAX:-1000000}
      SESSION_IDLE_TIMEOUT_MS: ${SESSION_IDLE_TIMEOUT_MS:-1800000}
      SESSION_ABSOLUTE_MAX_MS: ${SESSION_ABSOLUTE_MAX_MS:-28800000}
      UPLOAD_SANITIZE_ENABLED: ${UPLOAD_SANITIZE_ENABLED:-true}
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
    ports:
      - "3000:3000"
    volumes:
      - app_uploads:/app/backend/uploads

volumes:
  pgdata:
  app_uploads:
